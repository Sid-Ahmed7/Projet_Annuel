email.body.password_reset=Hallo,\n\nSie haben das Zurücksetzen Ihres Passworts für Ihr Konto angefordert.\n\nKlicken Sie auf den unten stehenden Link, um Ihr Passwort zurückzusetzen:\n{0}\n\nDieser Link ist 1 Stunde lang gültig.\n\nWenn Sie dieses Zurücksetzen nicht angefordert haben, ignorieren Sie diese E-Mail bitte.\n\nMit freundlichen Grüßen,\nDas Skaldly-Team

