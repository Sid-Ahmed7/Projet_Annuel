global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'glotrush-backend'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names:
          - 'tasks.skaldly_back'
        type: 'A'
        port: 8081

  - job_name: 'node-exporter'
    dns_sd_configs:
      - names:
          - 'tasks.monitoring_node-exporter'
        type: 'A'
        port: 9100

  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - 'tasks.monitoring_cadvisor'
        type: 'A'
        port: 8080
