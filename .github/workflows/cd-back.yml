name: CD Back

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "CI" ]
    branches: [ main, develop ]
    types: [ completed ]
jobs:
  deploy:
    name: Build & Deploy Back
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests -B

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push back
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: arthurbrd/glotrush-back:latest

      - name: Copy monitoring configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          source: "infra/monitoring.yml,infra/prometheus.yml"
          target: "infra"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            docker pull arthurbrd/glotrush-back:latest
            docker service update --image arthurbrd/glotrush-back:latest --force skaldly_back
            docker network inspect monitoring_net >/dev/null 2>&1 || docker network create --driver overlay --attachable monitoring_net
            docker service update --network-add monitoring_net skaldly_back || true
            cd infra
            docker stack deploy -c monitoring.yml monitoring